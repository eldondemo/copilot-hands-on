<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>Workshop Feedback Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">GitHub Copilot hands-on lab</p>
      <h1>Workshop feedback board</h1>
      <p>Share one thing that helped you learn and see feedback appear instantly.</p>
    </header>

    <!-- COPILOT TASK 1: Replace this comment with the feedback form and feedback list. -->
  </main>

  <script src="script.js"></script>
</body>
</html>
